# Continuous integration: install, build, and test on every push to main
# and every pull request. Kept to a single job on the oldest supported
# Node major (see "engines" in package.json) so a green check means the
# library works on the floor of its support range.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
